<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="auth-controls">
        <button
          type="button"
          id="user-menu-toggle"
          class="user-menu-toggle"
          aria-label="Teacher account"
          aria-expanded="false"
          aria-controls="auth-menu"
        >👤</button>
        <div id="auth-menu" class="auth-menu hidden">
          <p id="auth-status" role="status">Not signed in</p>
          <button type="button" id="login-open">Teacher login</button>
          <button type="button" id="logout-button" class="hidden">Log out</button>
        </div>
      </div>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <!-- Activities will be loaded here -->
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="signup-container" class="hidden">
        <h3>Register a Student</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
              <!-- Activity options will be loaded here -->
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
      </section>
      <div id="message" class="hidden" role="status" aria-live="polite"></div>
    </main>

    <dialog id="login-dialog" aria-labelledby="login-title">
      <form id="login-form">
        <h3 id="login-title">Teacher Login</h3>
        <div class="form-group">
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" autocomplete="username" required />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
        </div>
        <div class="login-actions">
          <button type="submit">Log in</button>
          <button type="button" id="login-cancel" class="secondary-button">Cancel</button>
        </div>
        <p id="login-error" class="error hidden" role="alert"></p>
      </form>
    </dialog>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
